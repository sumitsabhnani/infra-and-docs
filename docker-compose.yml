version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # Bound strictly to loopback for secure admin access
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "350mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ghcr.io/${GHCR_OWNER}/portfolio-optimizer-backend:latest
    container_name: portfolio-optimizer-backend
    restart: unless-stopped
    environment:
      # Memory Constraint: 1.5 GB Heap leaves room for off-heap Metaspace inside 2GB limit
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx1536m -XX:+UseSerialGC"

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      APP_BASE_URL: ${APP_BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INTERNAL_ADMIN_TOKEN: ${INTERNAL_ADMIN_TOKEN}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY}

      SNAPTRADE_CLIENT_ID: ${SNAPTRADE_CLIENT_ID}
      SNAPTRADE_CONSUMER_KEY: ${SNAPTRADE_CONSUMER_KEY}
      SNAPTRADE_REDIRECT_URI: ${SNAPTRADE_REDIRECT_URI}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      EODHD_API_KEY: ${EODHD_API_KEY}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY}
      ZERODHA_API_KEY: ${ZERODHA_API_KEY}
      ZERODHA_API_SECRET: ${ZERODHA_API_SECRET}
      BHAVKOSH_API_KEY: ${BHAVKOSH_API_KEY}
      BHAVKOSH_API_BASE_URL: ${BHAVKOSH_API_BASE_URL}

      FIGI_POLLER_ENABLED: "true"

      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}

      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID}
      FYERS_SECRET_KEY: ${FYERS_SECRET_KEY}
      PRICE_SWEEPER_BASE_URL: http://price-sweeper:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    networks:
      - app-network

  price-sweeper:
    image: ghcr.io/${GHCR_OWNER}/portfolio-price-sweeper:latest
    container_name: portfolio-price-sweeper
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - app-network

  frontend:
    image: ghcr.io/${GHCR_OWNER}/portfolio-optimizer-frontend:latest
    container_name: portfolio-optimizer-frontend
    restart: unless-stopped
    # No exposed host ports; cloudflared proxies traffic directly within app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    mem_limit: 128m
    networks:
      - app-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080" # Loopback only; view via SSH tunnel: ssh -L 9999:localhost:9999 user@vps
    mem_limit: 128m

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: